name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, unit tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Tier 1 replaces mapbox-gl in the page before the token is read, so
      # the build only needs a token-shaped value here, not a real one.
      NEXT_PUBLIC_MAPBOX_TOKEN: pk.e2e-placeholder
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # Unit tests are seconds, the build is minutes: fail on the cheap one.
      - run: pnpm test:unit

      - run: pnpm build

      # The browser build only changes when Playwright itself is bumped, so
      # key the cache on its version rather than the whole lockfile.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - run: pnpm exec playwright install --with-deps chromium

      # Tier 1: hermetic, no network, mapbox-gl stubbed. PREVIEW_URL is
      # deliberately unset here -- setting it would switch playwright.config
      # over to the review tier, which belongs in its own workflow against a
      # deployed preview. The build above is what `playwright test` would
      # otherwise run itself.
      - name: Playwright (tier 1, hermetic)
        run: pnpm exec playwright test
        env:
          PLAYWRIGHT_REUSE_BUILD: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      # The report embeds failure screenshots but not the traces, and a
      # trace is the only thing that explains a flake on a runner nobody
      # can attach a debugger to.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
