name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, unit tests + coverage, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Tier 1 replaces mapbox-gl in the page before the token is read, so
      # the build only needs a token-shaped value here, not a real one.
      NEXT_PUBLIC_MAPBOX_TOKEN: pk.e2e-placeholder
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # Unit tests are seconds, the build is minutes: fail on the cheap one.
      #
      # This is test:coverage, not test:unit, on purpose. The 100% thresholds
      # in vitest.config.mts are the branch's headline guarantee, and until
      # this step ran with --coverage nothing evaluated them automatically --
      # the gate held only as long as someone remembered to type the command.
      # Coverage costs about half a second here.
      - run: pnpm test:coverage

      # Tier 1 serves THIS build (PLAYWRIGHT_REUSE_BUILD below), and
      # e2e/hermetic/keycap-glyph.spec.ts measures a rendered glyph at all
      # three keycap sizes -- which only /specimens carries. The flag is
      # set here rather than at job level so it reaches the build and
      # nothing else; a deployment never sets it, which is the only place
      # the harness has to stay out of.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SPECIMENS: '1'

      # The browser build only changes when Playwright itself is bumped, so
      # key the cache on its version rather than the whole lockfile.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - run: pnpm exec playwright install --with-deps chromium

      # Tier 1: hermetic, no network, mapbox-gl stubbed. PREVIEW_URL is
      # deliberately unset here -- setting it would switch playwright.config
      # over to the review tier, which belongs in its own workflow against a
      # deployed preview. The build above is what `playwright test` would
      # otherwise run itself.
      - name: Playwright (tier 1, hermetic)
        run: pnpm exec playwright test
        env:
          PLAYWRIGHT_REUSE_BUILD: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      # The report embeds failure screenshots but not the traces, and a
      # trace is the only thing that explains a flake on a runner nobody
      # can attach a debugger to.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
